# Revisa cada semana si hay versiones nuevas (con parches de seguridad) de las dependencias
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Solo Java LTS (21, 25...). Las versiones intermedias tienen soporte de ~6 meses.
      - dependency-name: maven
        versions: ["3.9-eclipse-temurin-26", "3.9-eclipse-temurin-27", "3.9-eclipse-temurin-28"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
