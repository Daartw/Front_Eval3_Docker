server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de Nginx
    server_tokens off;

    # Cabeceras de seguridad (la política CSP completa va en el <meta> de index.html,
    # porque incluye las URLs de los backends definidas al construir la imagen)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Archivos ocultos (.env, .git...) nunca se sirven
    location ~ /\. {
        deny all;
        return 404;
    }
}
